<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infini Think - Console Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #0a0e27;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 15px;
        }
        
        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 0.9em;
            color: #00cc00;
            opacity: 0.8;
        }
        
        .console-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .console-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: #111627;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            overflow-x: auto;
        }
        
        .panel h2 {
            color: #00ff00;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #003300;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .label {
            color: #00ff00;
            font-weight: bold;
            min-width: 150px;
        }
        
        .value {
            color: #00cc00;
            text-align: right;
            flex: 1;
            margin-left: 10px;
            word-break: break-all;
        }
        
        .controls {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            background: #00ff00;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        button:hover {
            background: #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button.danger {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }
        
        button.danger:hover {
            background: #ff0000;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
        }
        
        .history-panel {
            grid-column: 1 / -1;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .message-item {
            background: #1a1f3a;
            border: 1px solid #003300;
            border-radius: 3px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.85em;
        }
        
        .message-item:last-child {
            margin-bottom: 0;
        }
        
        .timestamp {
            color: #00aa00;
            font-size: 0.8em;
            opacity: 0.7;
        }
        
        .user-msg {
            color: #00ff00;
            margin-top: 5px;
        }
        
        .ai-msg {
            color: #00ccff;
            margin-top: 5px;
        }
        
        .msg-label {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75em;
        }
        
        .loading {
            color: #ffaa00;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .error {
            color: #ff4444;
        }
        
        .success {
            color: #00ff00;
        }
        
        nav {
            position: fixed;
            top: 10px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        nav a {
            color: #00ff00;
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid #00ff00;
            border-radius: 3px;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        nav a:hover {
            background: #00ff00;
            color: #0a0e27;
        }
        
        .refresh-btn {
            padding: 5px 10px !important;
            font-size: 0.85em !important;
            margin-bottom: 10px !important;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Main Chat</a>
    </nav>
    
    <div class="container">
        <header>
            <h1>⚙️ INFINI THINK CONSOLE</h1>
            <p class="subtitle">System Control & Monitoring Interface</p>
        </header>
        
        <div class="console-grid">
            <!-- Status Panel -->
            <div class="panel">
                <h2>System Status</h2>
                <div id="status-content">
                    <div class="loading">Initializing...</div>
                </div>
            </div>
            
            <!-- Quick Stats Panel -->
            <div class="panel">
                <h2>Statistics</h2>
                <div id="stats-content">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="controls">
                <button onclick="refreshStatus()">🔄 Refresh Status</button>
                <button onclick="viewFullHistory()">📜 View Full History</button>
                <button class="danger" onclick="confirmClear()">🗑️ Clear History</button>
            </div>
            
            <!-- History Panel -->
            <div class="panel history-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2>Recent Messages</h2>
                    <button class="refresh-btn" onclick="loadHistory()">⟳ Refresh</button>
                </div>
                <div id="history-content">
                    <div class="loading">Loading messages...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function formatTime(timestamp) {
            try {
                return new Date(timestamp).toLocaleString();
            } catch {
                return timestamp;
            }
        }
        
        function refreshStatus() {
            fetch('/api/console/status')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        let html = `
                            <div class="status-item">
                                <span class="label">Status:</span>
                                <span class="value success">${data.status.toUpperCase()}</span>
                            </div>
                            <div class="status-item">
                                <span class="label">Model:</span>
                                <span class="value">${data.model}</span>
                            </div>
                            <div class="status-item">
                                <span class="label">History File:</span>
                                <span class="value">${data.history_file}</span>
                            </div>
                            <div class="status-item">
                                <span class="label">History Exists:</span>
                                <span class="value">${data.history_exists ? '✓ Yes' : '✗ No'}</span>
                            </div>
                            <div class="status-item">
                                <span class="label">Total Messages:</span>
                                <span class="value">${data.message_count}</span>
                            </div>
                            <div class="status-item">
                                <span class="label">History Size:</span>
                                <span class="value">${data.history_size_kb} KB</span>
                            </div>
                            <div class="status-item">
                                <span class="label">Context Window:</span>
                                <span class="value">${data.max_history_context} messages</span>
                            </div>
                        `;
                        document.getElementById('status-content').innerHTML = html;
                        
                        // Update stats
                        let statsHtml = `
                            <div class="status-item">
                                <span class="label">Messages Today:</span>
                                <span class="value">${data.message_count}</span>
                            </div>
                            <div class="status-item">
                                <span class="label">DB Size:</span>
                                <span class="value">${data.history_size_kb} KB</span>
                            </div>
                            <div class="status-item">
                                <span class="label">Avg Message Size:</span>
                                <span class="value">${data.message_count > 0 ? (data.history_size_kb / data.message_count).toFixed(2) : '0'} KB</span>
                            </div>
                            <div class="status-item">
                                <span class="label">API Status:</span>
                                <span class="value success">✓ Connected</span>
                            </div>
                        `;
                        document.getElementById('stats-content').innerHTML = statsHtml;
                    }
                })
                .catch(e => {
                    document.getElementById('status-content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
                });
        }
        
        function loadHistory() {
            fetch('/api/console/history')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        if (data.count === 0) {
                            document.getElementById('history-content').innerHTML = '<div class="status-item" style="color: #00aa00;">No messages yet...</div>';
                            return;
                        }
                        
                        let html = '';
                        // Show last 10 messages
                        data.messages.slice(-10).forEach((msg, idx) => {
                            html += `
                                <div class="message-item">
                                    <div class="timestamp">[${formatTime(msg.timestamp)}]</div>
                                    <div class="user-msg">
                                        <span class="msg-label">User:</span> ${msg.user}
                                    </div>
                                    <div class="ai-msg">
                                        <span class="msg-label">AI:</span> ${msg.infini_think}
                                    </div>
                                </div>
                            `;
                        });
                        document.getElementById('history-content').innerHTML = html;
                    }
                })
                .catch(e => {
                    document.getElementById('history-content').innerHTML = `<div class="error">Error loading history: ${e.message}</div>`;
                });
        }
        
        function viewFullHistory() {
            fetch('/api/console/history')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.count > 0) {
                        let text = `INFINI THINK - FULL CHAT HISTORY\n`;
                        text += `Total Messages: ${data.count}\n`;
                        text += `=${'='.repeat(60)}\n\n`;
                        
                        data.messages.forEach((msg, idx) => {
                            text += `[${idx + 1}] ${formatTime(msg.timestamp)}\n`;
                            text += `USER: ${msg.user}\n`;
                            text += `AI: ${msg.infini_think}\n`;
                            text += `-${'─'.repeat(60)}\n`;
                        });
                        
                        let blob = new Blob([text], { type: 'text/plain' });
                        let url = window.URL.createObjectURL(blob);
                        let a = document.createElement('a');
                        a.href = url;
                        a.download = 'infini-think-history.txt';
                        a.click();
                    }
                });
        }
        
        function confirmClear() {
            if (confirm('⚠️ Are you sure you want to clear all chat history? This cannot be undone.')) {
                fetch('/api/console/clear', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            alert('✓ History cleared successfully!');
                            refreshStatus();
                            loadHistory();
                        }
                    });
            }
        }
        
        // Initialize on load
        window.addEventListener('load', () => {
            refreshStatus();
            loadHistory();
            // Auto-refresh every 5 seconds
            setInterval(refreshStatus, 5000);
        });
    </script>
</body>
</html>
