[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infini-think"
version = "1.0.0"
description = "A local-first desktop AI agent powered by Ollama LLM"
readme = "README.md"
license = "MIT"
authors = [{ name = "InfiniThink Team" }]
requires-python = ">=3.10"
keywords = ["ai", "agent", "desktop", "ollama", "llm", "voice", "automation"]
dependencies = [
    "PySide6>=6.6.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
infini-think = "infini_think.app.launcher:main"

[project.urls]
Homepage = "https://github.com/your-org/infini-think"
Repository = "https://github.com/your-org/infini-think"
Issues = "https://github.com/your-org/infini-think/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["infini_think*"]

[tool.setuptools.package-data]
infini_think = ["assets/*.png"]



[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
