<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infini Think</title>
<link rel="icon" href="star2.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
    --primary-color: #6c5ce7;
    --secondary-color: #a29bfe;
    --accent-color: #00cec9;
    --glass-border: rgba(255,255,255,0.2);
    --text-white: #ffffff;
    --text-muted: #dfe6e9;
    --font-main: 'Segoe UI', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: var(--font-main);
    height:100vh;
    overflow:hidden;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    color:white;
}

/* LOGIN PAGE */
#loginPage {
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#loginBox {
    background: rgba(0,0,0,0.8);
    padding:40px 30px;
    border-radius:15px;
    text-align:center;
    width:320px;
}

#loginBox h2 { margin-bottom:20px; color:#ffd700; }

#loginBox input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
}

#loginBox button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background: linear-gradient(135deg,#6c5ce7,#a29bfe);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN PAGE */
#mainPage { display:none; height:100%; }

/* STAR BACKGROUND */
#star-container {
    position:absolute;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

.star {
    position:absolute;
    border-radius:50%;
    opacity:0;
    animation: twinkle var(--duration) ease-in-out infinite;
}

@keyframes twinkle {
    0% { transform:scale(0.5); opacity:0; }
    50% { transform:scale(1.2); opacity:1; }
    100% { transform:scale(0.5); opacity:0; }
}

/* LAYOUT */
.app-container { display:flex; height:100vh; }

aside {
    width:260px;
    background:rgba(0,0,0,0.4);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.brand-btn {
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#6c5ce7,#a29bfe);
}

.brand-btn.secondary {
    background:rgba(255,255,255,0.1);
    border:1px solid var(--glass-border);
}

.brand-btn.jolly {
    background:linear-gradient(135deg,#ff9ff3,#f368e0);
}

main { flex:1; display:flex; flex-direction:column; }

header {
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.3);
}

.settings-btn {
    background:transparent;
    border:1px solid white;
    color:white;
    padding:6px 12px;
    cursor:pointer;
}

#settings-panel {
    position:absolute;
    top:60px;
    right:20px;
    background:#111;
    padding:15px;
    border-radius:10px;
    display:none;
    width:250px;
}

.theme-option {
    display:block;
    width:100%;
    padding:8px;
    margin:5px 0;
    background:#222;
    border:none;
    color:white;
    cursor:pointer;
}

.chat-feed {
    flex:1;
    padding:20px;
    overflow-y:auto;
}

.message {
    max-width:70%;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

.user {
    background:#6c5ce7;
    align-self:flex-end;
}

.ai {
    background:rgba(255,255,255,0.2);
}

.input-wrapper {
    padding:15px;
    background:rgba(0,0,0,0.3);
}

.input-bar {
    display:flex;
}

.input-field {
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
}

.send-btn {
    margin-left:10px;
    padding:10px 15px;
    border:none;
    border-radius:20px;
    background:#6c5ce7;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div id="loginBox">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <button onclick="submitLogin()">Submit</button>
    </div>
</div>

<!-- MAIN PAGE -->
<div id="mainPage">
    <div id="star-container"></div>
    <div class="app-container">

        <!-- LEFT SIDE -->
        <aside>
            <button class="brand-btn" onclick="newChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>

            <button class="brand-btn secondary" onclick="newProject()">
                <i class="fas fa-folder-open"></i> Project
            </button>

            <button class="brand-btn secondary" onclick="openLibrary()">
                <i class="fas fa-book"></i> Library
            </button>

            <button class="brand-btn jolly" onclick="triggerJollyMode()">
                <i class="fas fa-laugh-beam"></i> Jolly AI
            </button>
        </aside>

        <!-- CHAT AREA -->
        <main>
            <header>
                <div><b>★ Infini Think</b></div>
                <button class="settings-btn" onclick="toggleSettings()">Settings</button>

                <div id="settings-panel">
                    <h4>Appearance</h4>

                    <button class="theme-option" onclick="changeBg('galaxy')">Galaxy</button>
                    <button class="theme-option" onclick="changeBg('sunset')">Sunset</button>
                    <button class="theme-option" onclick="changeBg('matrix')">Matrix</button>

                    <hr>

                    <label>Background Color
                        <input type="color" id="bgColorPicker">
                    </label>
                    <br><br>

                    <label>
                        <input type="checkbox" id="starsToggle" checked>
                        Show Stars
                    </label>
                </div>
            </header>

            <div class="chat-feed" id="chatFeed"></div>

            <div class="input-wrapper">
                <div class="input-bar">
                    <input type="text" id="userInput" class="input-field" placeholder="Ask something...">
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </main>
    </div>
</div>

<script>

/* LOGIN */
function submitLogin(){
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    if(username === "" || email === ""){
        alert("Username and Email are required!");
        return;
    }

    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if(!email.match(emailPattern)){
        alert("Enter valid email!");
        return;
    }

    document.getElementById("loginPage").style.display="none";
    document.getElementById("mainPage").style.display="block";
}

/* CHAT */
function sendMessage(){
    const input=document.getElementById("userInput");
    if(input.value.trim()==="") return;

    const chat=document.getElementById("chatFeed");

    chat.innerHTML += `<div class="message user">${input.value}</div>`;
    chat.innerHTML += `<div class="message ai">Processing your request...</div>`;

    input.value="";
    chat.scrollTop=chat.scrollHeight;
}

function newChat(){ document.getElementById("chatFeed").innerHTML=""; }
function newProject(){ alert("New Project Created!"); }
function openLibrary(){ alert("Opening Library..."); }
function triggerJollyMode(){ alert("Jolly Mode Activated 🎉"); }

/* SETTINGS */
function toggleSettings(){
    const panel=document.getElementById("settings-panel");
    panel.style.display = panel.style.display==="block" ? "none" : "block";
}

document.addEventListener("click",function(e){
    const panel=document.getElementById("settings-panel");
    const btn=document.querySelector(".settings-btn");

    if(panel.style.display==="block" &&
       !panel.contains(e.target) &&
       !btn.contains(e.target)){
        panel.style.display="none";
    }
});

function changeBg(theme){
    if(theme==="galaxy")
        document.body.style.background="radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%)";
    if(theme==="sunset")
        document.body.style.background="linear-gradient(to right,#ff7e5f,#feb47b)";
    if(theme==="matrix")
        document.body.style.background="black";
}

document.getElementById("bgColorPicker").addEventListener("input",function(){
    document.body.style.background=this.value;
});

document.getElementById("starsToggle").addEventListener("change",function(){
    document.getElementById("star-container").style.display=
        this.checked ? "block" : "none";
});


/* STARS */
const starContainer=document.getElementById("star-container");
for(let i=0;i<120;i++){
    const star=document.createElement("div");
    star.className="star";
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    star.style.width=star.style.height=Math.random()*3+"px";
    star.style.background="white";
    star.style.setProperty("--duration",(Math.random()*3+2)+"s");
    starContainer.appendChild(star);
}
</script>
</body>
</html>
